name: CI/CD - CompanyTshirt Azure App Service

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: companytshirt-api-eguiazu
  DOTNET_VERSION: '10.0.x'
  SOLUTION: CompanyTshirt.sln
  STARTUP_PROJECT: CompanyTshirt/CompanyTshirt.Presentation.csproj
  MIGRATIONS_PROJECT: Infraestructure/CompanyTshirt.Infrastructure.csproj

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.STARTUP_PROJECT }} --configuration Release --no-build --no-restore --output ./publish

      - name: Install EF Core tools
        if: github.event_name != 'pull_request'
        run: dotnet tool install --global dotnet-ef --version 10.0.0

      - name: Apply database migrations
        if: github.event_name != 'pull_request'
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: dotnet ef database update --project ${{ env.MIGRATIONS_PROJECT }} --startup-project ${{ env.STARTUP_PROJECT }} --connection "$DB_CONNECTION_STRING"

      - name: Deploy to Azure App Service
        if: github.event_name != 'pull_request'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish